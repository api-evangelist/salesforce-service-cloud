naftiko: 1.0.0-alpha2
info:
  label: Salesforce Service Cloud REST API — Query
  description: 'Salesforce Service Cloud REST API — Query. 1 operations. Lead operation: Salesforce Service Cloud Execute
    a SOQL query. Self-contained Naftiko capability covering one Salesforce Service Cloud business surface.'
  tags:
  - Salesforce Service Cloud
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SERVICE_CLOUD_API_KEY: SALESFORCE_SERVICE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-query
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Service Cloud REST API — Query business capability. Self-contained, no shared references.
    resources:
    - name: query
      path: /query
      operations:
      - name: executequery
        method: GET
        description: Salesforce Service Cloud Execute a SOQL query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: SOQL query string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SERVICE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-query-rest
    port: 8080
    description: REST adapter for Salesforce Service Cloud REST API — Query. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/query
      name: query
      description: REST surface for query.
      operations:
      - method: GET
        name: executequery
        description: Salesforce Service Cloud Execute a SOQL query
        call: rest-query.executequery
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Service Cloud REST API — Query. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: salesforce-service-cloud-execute-soql
      description: Salesforce Service Cloud Execute a SOQL query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.executequery
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
