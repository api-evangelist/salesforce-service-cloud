naftiko: 1.0.0-alpha2
info:
  label: Salesforce Service Cloud Salesforce Chat REST API — Messages
  description: 'Salesforce Service Cloud Salesforce Chat REST API — Messages. 2 operations. Lead operation: Salesforce Service
    Cloud Send a chat message. Self-contained Naftiko capability covering one Salesforce Service Cloud business surface.'
  tags:
  - Salesforce Service Cloud
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SERVICE_CLOUD_API_KEY: SALESFORCE_SERVICE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesforce-live-agent-messages
    baseUri: https://{hostname}/chat/rest
    description: Salesforce Service Cloud Salesforce Chat REST API — Messages business capability. Self-contained, no shared
      references.
    resources:
    - name: Chasitor-ChatMessage
      path: /Chasitor/ChatMessage
      operations:
      - name: sendchatmessage
        method: POST
        description: Salesforce Service Cloud Send a chat message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: System-Messages
      path: /System/Messages
      operations:
      - name: getmessages
        method: GET
        description: Salesforce Service Cloud Get chat messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-LIVEAGENT-API-VERSION
      value: '{{env.SALESFORCE_SERVICE_CLOUD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: salesforce-live-agent-messages-rest
    port: 8080
    description: REST adapter for Salesforce Service Cloud Salesforce Chat REST API — Messages. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/chasitor/chatmessage
      name: chasitor-chatmessage
      description: REST surface for Chasitor-ChatMessage.
      operations:
      - method: POST
        name: sendchatmessage
        description: Salesforce Service Cloud Send a chat message
        call: salesforce-live-agent-messages.sendchatmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/system/messages
      name: system-messages
      description: REST surface for System-Messages.
      operations:
      - method: GET
        name: getmessages
        description: Salesforce Service Cloud Get chat messages
        call: salesforce-live-agent-messages.getmessages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesforce-live-agent-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Service Cloud Salesforce Chat REST API — Messages. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-service-cloud-send-chat
      description: Salesforce Service Cloud Send a chat message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesforce-live-agent-messages.sendchatmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-service-cloud-get-chat
      description: Salesforce Service Cloud Get chat messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesforce-live-agent-messages.getmessages
      outputParameters:
      - type: object
        mapping: $.
