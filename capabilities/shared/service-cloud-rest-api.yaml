naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Service Cloud REST API"
  description: "RESTful API for managing customer service operations including cases, contacts, accounts, knowledge articles, and other service-related objects."
  tags:
    - Salesforce
    - Service Cloud
    - Customer Service
    - Cases
    - CRM
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_ACCESS_TOKEN: SALESFORCE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: salesforce-service-rest
      baseUri: https://{instance}.salesforce.com/services/data/v59.0
      description: "Salesforce Service Cloud REST API"
      authentication:
        type: bearer
        token: "{{SALESFORCE_ACCESS_TOKEN}}"
      resources:
        - name: cases
          path: /sobjects/Case
          description: "Case management"
          operations:
            - name: get-case-info
              method: GET
              description: "Get Case object metadata and recent cases"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-case
              method: POST
              description: "Create a new customer service case"
              body:
                type: json
                data:
                  Subject: "{{tools.subject}}"
                  Description: "{{tools.description}}"
                  Status: "{{tools.status}}"
                  Priority: "{{tools.priority}}"
                  AccountId: "{{tools.accountId}}"
                  ContactId: "{{tools.contactId}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: case
          path: /sobjects/Case/{caseId}
          description: "Individual case operations"
          operations:
            - name: get-case
              method: GET
              description: "Get a case by ID"
              inputParameters:
                - name: caseId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the Case"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-case
              method: PATCH
              description: "Update a case"
              inputParameters:
                - name: caseId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the Case"
              body:
                type: json
                data:
                  Status: "{{tools.status}}"
                  Priority: "{{tools.priority}}"
                  Description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-case
              method: DELETE
              description: "Delete a case"
              inputParameters:
                - name: caseId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the Case"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: contacts
          path: /sobjects/Contact
          description: "Contact management"
          operations:
            - name: create-contact
              method: POST
              description: "Create a new contact"
              body:
                type: json
                data:
                  FirstName: "{{tools.firstName}}"
                  LastName: "{{tools.lastName}}"
                  Email: "{{tools.email}}"
                  AccountId: "{{tools.accountId}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: contact
          path: /sobjects/Contact/{contactId}
          description: "Individual contact operations"
          operations:
            - name: get-contact
              method: GET
              description: "Get a contact by ID"
              inputParameters:
                - name: contactId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the Contact"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: accounts
          path: /sobjects/Account/{accountId}
          description: "Account operations"
          operations:
            - name: get-account
              method: GET
              description: "Get an account by ID"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Salesforce ID of the Account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: service-query
          path: /query
          description: "SOQL query for service data"
          operations:
            - name: query-service-data
              method: GET
              description: "Query service cloud data with SOQL"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "SOQL query string"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: service-cloud-rest-api
      resources:
        - path: /v1/cases
          name: cases
          description: "Case management"
          operations:
            - method: POST
              name: create-case
              description: "Create a case"
              call: "salesforce-service-rest.create-case"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cases/{caseId}
          name: case
          description: "Individual case"
          operations:
            - method: GET
              name: get-case
              description: "Get a case"
              call: "salesforce-service-rest.get-case"
              with:
                caseId: "rest.caseId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PATCH
              name: update-case
              description: "Update a case"
              call: "salesforce-service-rest.update-case"
              with:
                caseId: "rest.caseId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: service-cloud-rest-mcp
      transport: http
      tools:
        - name: get-case
          description: "Get a customer service case by ID"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-service-rest.get-case"
          with:
            caseId: "tools.caseId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-case
          description: "Create a new customer service case"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-service-rest.create-case"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-case
          description: "Update case status, priority, or description"
          hints:
            readOnly: false
            idempotent: true
          call: "salesforce-service-rest.update-case"
          with:
            caseId: "tools.caseId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-case
          description: "Delete a case record"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "salesforce-service-rest.delete-case"
          with:
            caseId: "tools.caseId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-contact
          description: "Get a contact record"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-service-rest.get-contact"
          with:
            contactId: "tools.contactId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-contact
          description: "Create a new contact"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-service-rest.create-contact"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-account
          description: "Get an account record"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-service-rest.get-account"
          with:
            accountId: "tools.accountId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-service-data
          description: "Query service cloud data using SOQL"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-service-rest.query-service-data"
          with:
            q: "tools.q"
          outputParameters:
            - type: object
              mapping: "$."
