naftiko: 1.0.0-alpha2
info:
  label: Salesforce Service Cloud REST API — Accounts
  description: 'Salesforce Service Cloud REST API — Accounts. 1 operations. Lead operation: Salesforce Service Cloud Get Account
    object metadata. Self-contained Naftiko capability covering one Salesforce Service Cloud business surface.'
  tags:
  - Salesforce Service Cloud
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SERVICE_CLOUD_API_KEY: SALESFORCE_SERVICE_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-accounts
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Service Cloud REST API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: sobjects-Account
      path: /sobjects/Account
      operations:
      - name: getaccountinfo
        method: GET
        description: Salesforce Service Cloud Get Account object metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SERVICE_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-accounts-rest
    port: 8080
    description: REST adapter for Salesforce Service Cloud REST API — Accounts. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/sobjects/account
      name: sobjects-account
      description: REST surface for sobjects-Account.
      operations:
      - method: GET
        name: getaccountinfo
        description: Salesforce Service Cloud Get Account object metadata
        call: rest-accounts.getaccountinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Service Cloud REST API — Accounts. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: salesforce-service-cloud-get-account
      description: Salesforce Service Cloud Get Account object metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-accounts.getaccountinfo
      outputParameters:
      - type: object
        mapping: $.
