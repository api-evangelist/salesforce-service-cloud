openapi: 3.2.0
info:
  title: Salesforce Service Cloud Salesforce Chat REST Settings API
  description: REST API for managing live chat sessions between agents and visitors in Salesforce Service Cloud. Enables initiating chat sessions, sending and receiving messages, and monitoring chat activity.
  version: '59.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
  termsOfService: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{hostname}/chat/rest
  description: Chat REST API Endpoint
  variables:
    hostname:
      default: d.la1-c1-ia4.salesforceliveagent.com
      description: Your Live Agent endpoint hostname
security:
- apiKey: []
tags:
- name: Settings
  description: Chat deployment settings
paths:
  /Visitor/Settings:
    get:
      operationId: getSettings
      summary: Salesforce Service Cloud Get deployment settings
      description: Retrieves settings and configuration for a chat deployment, used to initialize the chat client.
      tags:
      - Settings
      parameters:
      - name: org_id
        in: query
        required: true
        description: Salesforce organization ID
        schema:
          type: string
      - name: deployment_id
        in: query
        required: true
        description: Chat deployment ID
        schema:
          type: string
      responses:
        '200':
          description: Deployment settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
components:
  schemas:
    SettingsResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
          description: Settings configuration messages
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-LIVEAGENT-API-VERSION
      description: Live Agent API version header
externalDocs:
  description: Chat REST API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.live_agent_rest.meta/live_agent_rest/
