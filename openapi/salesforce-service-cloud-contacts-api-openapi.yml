openapi: 3.2.0
info:
  title: Salesforce Service Cloud REST Contacts API
  description: RESTful API for managing customer service operations in Salesforce Service Cloud, including cases, contacts, accounts, knowledge articles, and other service-related objects via the sObject framework.
  version: '59.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
  termsOfService: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0
  description: Salesforce Production Instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Contacts
  description: Operations for managing contact records
paths:
  /sobjects/Contact:
    get:
      operationId: getContactInfo
      summary: Salesforce Service Cloud Get Contact object metadata
      description: Retrieves basic metadata and recently created contacts for the Contact sObject type.
      tags:
      - Contacts
      responses:
        '200':
          description: Contact object metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SObjectBasicInfo'
    post:
      operationId: createContact
      summary: Salesforce Service Cloud Create a new contact
      description: Creates a new contact record associated with customer service interactions.
      tags:
      - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
components:
  schemas:
    ContactInput:
      type: object
      properties:
        FirstName:
          type: string
          description: Contact first name
        LastName:
          type: string
          description: Contact last name
        Email:
          type: string
          format: email
          description: Contact email address
        Phone:
          type: string
          description: Contact phone number
        AccountId:
          type: string
          description: ID of the associated account
      required:
      - LastName
    CreateResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the created record
        success:
          type: boolean
          description: Whether the operation succeeded
        errors:
          type: array
          items:
            type: object
          description: List of errors if any
    SObjectBasicInfo:
      type: object
      properties:
        objectDescribe:
          type: object
          description: Object metadata
        recentItems:
          type: array
          items:
            type: object
          description: Recently created or updated records
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access Salesforce REST API
            full: Full access
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
externalDocs:
  description: REST API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/
