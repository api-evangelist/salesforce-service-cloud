openapi: 3.2.0
info:
  title: Salesforce Service Cloud REST Search API
  description: RESTful API for managing customer service operations in Salesforce Service Cloud, including cases, contacts, accounts, knowledge articles, and other service-related objects via the sObject framework.
  version: '59.0'
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/support
  termsOfService: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0
  description: Salesforce Production Instance
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Search
  description: SOSL search operations
paths:
  /search:
    get:
      operationId: executeSearch
      summary: Salesforce Service Cloud Execute a SOSL search
      description: Executes a SOSL search across service cloud objects and returns matching records.
      tags:
      - Search
      parameters:
      - name: q
        in: query
        required: true
        description: SOSL search string
        schema:
          type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
components:
  schemas:
    SearchResult:
      type: object
      properties:
        searchRecords:
          type: array
          items:
            type: object
          description: Array of matching records
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access Salesforce REST API
            full: Full access
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
externalDocs:
  description: REST API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/
